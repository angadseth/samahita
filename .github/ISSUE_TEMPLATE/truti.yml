name: त्रुटि बताएँ (report a mistake)
description: किसी व्रत, तिथि या पाठ में गलती बताएँ — report a wrong line, date or text.
title: "त्रुटि: "
labels: ["truti"]
body:
  - type: markdown
    attributes:
      value: |
        धन्यवाद। हर सुधार ग्रन्थ के स्कैन से मिलाकर ही किया जाता है।
        Thank you. Every fix is checked against the book's scan before it goes live.
  - type: input
    id: page
    attributes:
      label: पृष्ठ (page link)
      description: साइट का पता जहाँ गलती दिखी — the Samahita page URL
      placeholder: https://angadseth.github.io/samahita/vrat/...
    validations:
      required: true
  - type: input
    id: line
    attributes:
      label: पंक्ति (line)
      description: पंक्ति संख्या या उद्धरण के शब्द — line id (e.g. p602-L022) or the words
  - type: textarea
    id: wrong
    attributes:
      label: क्या गलत है (what is wrong)
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: सही पाठ (correct text)
      description: स्कैन में जो लिखा है — what the scan actually says, if you know
